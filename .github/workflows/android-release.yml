name: Build signed EX1 LEGEND Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Public release tag (for example v2.2.0)"
        required: true
        type: string
        default: "v2.2.0"
      version_code:
        description: "Android versionCode (must increase for each update)"
        required: true
        type: string
        default: "6"
      version_name:
        description: "Android versionName"
        required: true
        type: string
        default: "2.2.0"

permissions:
  contents: write

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - name: Checkout reviewed production branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Validate release inputs and signing secrets
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid versionCode"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid versionName"; exit 1; }
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing GitHub secret: $key"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ex1-release.jks"
          test -s "$RUNNER_TEMP/ex1-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ex1-release.jks" >> "$GITHUB_ENV"

      - name: Build signed player and admin APKs
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assemblePlayerRelease assembleAdminRelease \
            -Pex1VersionCode="${{ inputs.version_code }}" \
            -Pex1VersionName="${{ inputs.version_name }}"

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/player/release/app-player-release.apk
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/admin/release/app-admin-release.apk

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          cp android/app/build/outputs/apk/player/release/app-player-release.apk release-apks/EX1-LEGEND-Player.apk
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk release-apks/EX1-LEGEND-Admin.apk
          sha256sum release-apks/*.apk > release-apks/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EX1-LEGEND-Signed-Release-APKs
          path: release-apks/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-apks/*.apk release-apks/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "EX1 LEGEND $VERSION_NAME" \
            --notes "نسخه رسمی EX1 LEGEND. امتیازهای درون‌برنامه‌ای صرفاً مجازی و فاقد ارزش نقدی هستند."

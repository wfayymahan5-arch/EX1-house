name: Build EX1 LEGEND Android preview APKs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/android-shell-current-main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Bundle current player and admin web pages into APKs
        run: |
          mkdir -p android/app/src/main/assets
          cp app.html android/app/src/main/assets/ex1-player.html
          cp admin.html android/app/src/main/assets/ex1-admin.html
      - name: Build player and admin preview APKs
        working-directory: android
        run: gradle -Pex1BaseUrl=https://ex1-house.vercel.app assemblePlayerDebug assembleAdminDebug
      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/player/debug/app-player-debug.apk release-apks/EX1-LEGEND-Player-preview.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk release-apks/EX1-LEGEND-Admin-preview.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EX1-LEGEND-Android-Preview-APKs
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest preview APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "EX1 LEGEND Android Preview" --notes "Latest test APKs. These are preview/debug builds, not production releases." --prerelease
          gh release upload "$TAG" release-apks/*.apk --clobber

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ex1-android-app-redesign

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EX1-LEGEND-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EX1-LEGEND-Android-APK
          path: EX1-LEGEND-debug.apk
          if-no-files-found: error
          retention-days: 14

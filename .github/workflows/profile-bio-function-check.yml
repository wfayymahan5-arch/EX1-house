name: Validate EX1 profile biography function

on:
  push:
    branches:
      - feature/native-android-migration
    paths:
      - "supabase/functions/update-profile/**"
      - ".github/workflows/profile-bio-function-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/update-profile/**"
      - ".github/workflows/profile-bio-function-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check profile update Edge Function
        run: deno check --no-lock supabase/functions/update-profile/index.ts
